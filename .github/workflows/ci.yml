name: CI

on:
  # Run on pushes to the trunk and to the long-lived integration / feature branches, and on
  # every pull request regardless of its base — so PRs that target an integration branch (not
  # just main) are gated too.
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FluentPdf.slnx

      - name: Build (warnings are errors)
        run: dotnet build FluentPdf.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test FluentPdf.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"

  mutation:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore FluentPdf.slnx

      - name: Run mutation tests (Stryker)
        run: dotnet stryker
