name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FluentPdf.slnx

      - name: Build (warnings are errors)
        run: dotnet build FluentPdf.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test FluentPdf.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"

  # Compile and run the *same* adapter source through the full contract kit against more than
  # one major of its underlying library, proving FluentPdf supports each — the package topology,
  # not just the version, can change across majors (iText 8 splits BouncyCastle into its own
  # package; QuestPDF 2024 bundles the SkiaSharp Linux native assets, 2023 does not).
  adapter-version-matrix:
    name: ${{ matrix.label }} conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iText 7.2.x
            project: tests/FluentPdf.Adapters.iText.ConformanceTests/FluentPdf.Adapters.iText.ConformanceTests.csproj
            prop: ITextMajor=7
          - label: iText 8.x
            project: tests/FluentPdf.Adapters.iText.ConformanceTests/FluentPdf.Adapters.iText.ConformanceTests.csproj
            prop: ITextMajor=8
          - label: QuestPDF 2023.x
            project: tests/FluentPdf.Adapters.QuestPdf.ConformanceTests/FluentPdf.Adapters.QuestPdf.ConformanceTests.csproj
            prop: QuestPdfMajor=2023
          - label: QuestPDF 2024.x
            project: tests/FluentPdf.Adapters.QuestPdf.ConformanceTests/FluentPdf.Adapters.QuestPdf.ConformanceTests.csproj
            prop: QuestPdfMajor=2024
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # QuestPDF's SkiaSharp .NoDependencies native assets rely on the system fontconfig.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: ${{ matrix.label }} conformance
        run: >
          dotnet test ${{ matrix.project }}
          --configuration Release
          -p:${{ matrix.prop }}

  mutation:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore FluentPdf.slnx

      - name: Run mutation tests (Stryker)
        run: dotnet stryker
